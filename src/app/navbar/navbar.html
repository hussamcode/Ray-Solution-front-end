@if(isAdmin){

<a
  [routerLink]="route ? '/' + route : '/' + title.toLowerCase()"
  routerLinkActive="!text-blue-700 !bg-blue-50"
  [routerLinkActiveOptions]="{ exact: true }"
  class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-slate-900"
>
  {{title}}
</a>

}
