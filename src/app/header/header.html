<header class="sticky top-0 w-full z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200/50 shadow-sm">
    <div class="flex justify-between items-center px-8 h-16 max-w-screen-2xl mx-auto">
        
        <!-- Logo -->
        <div class="text-xl font-black text-slate-900 tracking-tight">Ray Solution</div>

        <!-- Nav -->
       <nav class="hidden md:flex items-center gap-1">
            <a class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all duration-200"
            routerLink="/home"
            routerLinkActive="!text-blue-700 !bg-blue-50 !hover:bg-blue-50"
            [routerLinkActiveOptions]="{exact: true}">
                Catalog
            </a>
            <a class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all duration-200"
            routerLink="/order"
            routerLinkActive="!text-blue-700 !bg-blue-50 !hover:bg-blue-50"
            [routerLinkActiveOptions]="{exact: true}">
                Order
            </a>
            <a class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all duration-200"
            routerLink="/support"
            routerLinkActive="!text-blue-700 !bg-blue-50 !hover:bg-blue-50"
            [routerLinkActiveOptions]="{exact: true}">
                Support
            </a>
                    <app-navbar></app-navbar>
        </nav>

        <!-- Actions -->
        <div class="flex items-center gap-2">
            
            <!-- Search -->
            <div class="relative hidden lg:block">
                <span class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></span>
                <input class="bg-slate-100 border-none rounded-xl pl-9 pr-4 py-2 w-56 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all duration-200"
                       placeholder="Search catalog..."
                       type="text"
                       [(ngModel)]="searchTermvale"
                       (ngModelChange)="onSearch($event)">
            </div>


            <button class="relative p-2.5 hover:bg-slate-100 rounded-xl transition-all duration-200 active:scale-95 cursor-pointer" routerLink="/order">
               
                <span class="fa-solid fa-plus text-slate-700 text-lg"></span>
                @if(allprotectedadd() > 0){
                <span class="absolute -top-1 -right-1 w-5 h-5 bg-blue-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center"   >
                    {{allprotectedadd()}}
                </span>
                
                }
            </button>

            <!-- User -->
            <button class="p-2.5 hover:bg-slate-100 rounded-xl transition-all duration-200 active:scale-95 cursor-pointer">
                <span class="fa-regular fa-circle-user text-slate-700 text-lg"></span>
            </button>
        </div>
    </div>
</header>
