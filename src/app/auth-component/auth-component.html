<div class="min-h-screen flex items-center justify-center bg-gray-100">

  <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-lg">

    <!-- LOGIN -->
    <h2 class="text-2xl font-bold text-center mb-4">Login</h2>

    <input
      [(ngModel)]="login.username"
      placeholder="Email"
      class="w-full p-3 mb-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
    />

    <input
      [(ngModel)]="login.password"
      type="password"
      placeholder="Password"
      class="w-full p-3 mb-4 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
    />

    <button
      (click)="loginUser()"
      class="w-full bg-blue-500 text-white p-3 rounded-lg hover:bg-blue-600 transition">
      Login
    </button>

    <hr class="my-6">

    <!-- signup -->
    <h2 class="text-2xl font-bold text-center mb-4">signup</h2>

    <input
      [(ngModel)]="register.name"
      placeholder="Name"
      class="w-full p-3 mb-3 border rounded-lg focus:ring-2 focus:ring-green-400 outline-none"
    />

    <input
      [(ngModel)]="register.email"
      placeholder="Email"
      class="w-full p-3 mb-3 border rounded-lg focus:ring-2 focus:ring-green-400 outline-none"
    />

    <input
      [(ngModel)]="register.password"
      type="password"
      placeholder="Password"
      class="w-full p-3 mb-4 border rounded-lg focus:ring-2 focus:ring-green-400 outline-none"
    />

    <button
      (click)="registerUser()"
      class="w-full bg-green-500 text-white p-3 rounded-lg hover:bg-green-600 transition">
      signup
    </button>

  </div>

</div>
