<div class="flex flex-col bg-surface-container-lowest rounded-xl overflow-hidden group">
    <div class="aspect-square bg-surface-container overflow-hidden">
    
        <img alt="Ergonomic Mouse"
         class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
          data-alt="sleek modern vertical ergonomic computer mouse in matte space gray resting on a premium leather desk mat" 
          src="data:image/png;base64,{{url}}" >
    </div>
    <div class="p-6">
        <h4 class="font-headline font-bold text-xl mb-1">{{producer()?.name}}</h4>
        <p class="text-on-secondary-container text-sm mb-4">{{producer()?.description  }}</p>
        <div class="flex justify-between items-center mt-auto">
            <button (click)="orderproducer()" class="p-2 bg-surface-container-high rounded-lg text-on-primary-fixed-variant hover:bg-primary [&_*]:text-blue-800  hover:[&_*]:text-white  transition-colors cursor-pointer">
                <span class="fa-solid fa-plus"></span>
            
            </button>
        </div>
    </div>
</div>
